<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Pi-hole dashboard</title>
  <desc id="desc">Dashboard view for a Pi-hole DNS filtering appliance showing queries, blocked domains, and network status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
      .muted { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .card { fill: rgba(15, 23, 42, 0.82); stroke: #334155; stroke-width: 2; }
      .green { fill: #22c55e; }
      .orange { fill: #f59e0b; }
      .red { fill: #ef4444; }
      .blue { fill: #60a5fa; }
      .grid { stroke: rgba(148, 163, 184, 0.2); stroke-width: 1; }
    </style>
  </defs>
  <rect width="1200" height="780" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="title">Pi-hole Network Filter Dashboard</text>

  <g>
    <rect x="80" y="96" width="1040" height="580" rx="18" class="card"/>

    <g>
      <rect x="120" y="130" width="180" height="90" rx="12" fill="rgba(78, 156, 255, 0.18)" stroke="#60a5fa"/>
      <text x="210" y="170" text-anchor="middle" class="label">Queries</text>
      <text x="210" y="196" text-anchor="middle" style="font: 700 28px 'Segoe UI'; fill:#f8fafc;">3,500</text>
    </g>
    <g>
      <rect x="330" y="130" width="180" height="90" rx="12" fill="rgba(34, 197, 94, 0.18)" stroke="#22c55e"/>
      <text x="420" y="170" text-anchor="middle" class="label">Allowed</text>
      <text x="420" y="196" text-anchor="middle" style="font: 700 28px 'Segoe UI'; fill:#f8fafc;">71</text>
    </g>
    <g>
      <rect x="540" y="130" width="180" height="90" rx="12" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b"/>
      <text x="630" y="170" text-anchor="middle" class="label">Blocked</text>
      <text x="630" y="196" text-anchor="middle" style="font: 700 28px 'Segoe UI'; fill:#f8fafc;">2.0%</text>
    </g>
    <g>
      <rect x="750" y="130" width="180" height="90" rx="12" fill="rgba(239, 68, 68, 0.18)" stroke="#ef4444"/>
      <text x="840" y="170" text-anchor="middle" class="label">Clients</text>
      <text x="840" y="196" text-anchor="middle" style="font: 700 28px 'Segoe UI'; fill:#f8fafc;">6</text>
    </g>

    <g>
      <rect x="120" y="260" width="900" height="300" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="#334155"/>
      <text x="150" y="292" class="label">Live query graph</text>
      <g transform="translate(150 320)">
        <g class="grid">
          <path d="M0 180 H700"/>
          <path d="M0 140 H700"/>
          <path d="M0 100 H700"/>
          <path d="M0 60 H700"/>
          <path d="M0 20 H700"/>
          <path d="M0 0 H700"/>
        </g>
        <path d="M0 120 L40 110 L80 122 L120 96 L160 86 L200 92 L240 68 L280 72 L320 58 L360 62 L400 34 L440 46 L480 38 L520 40 L560 22 L600 30 L640 18 L680 12" fill="none" stroke="#60a5fa" stroke-width="4"/>
        <path d="M0 150 L40 148 L80 138 L120 136 L160 146 L200 142 L240 124 L280 118 L320 132 L360 126 L400 114 L440 118 L480 106 L520 104 L560 102 L600 98 L640 90 L680 86" fill="none" stroke="#22c55e" stroke-width="4"/>
      </g>
    </g>
  </g>
</svg>
